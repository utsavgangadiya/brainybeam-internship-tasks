
name: Heart Disease App CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r 04_11_task1/requirements.txt

      - name: Check Python syntax
        run: |
          python -m py_compile 04_11_task1/app.py

      - name: Check model loading
        run: |
          python -c "import joblib; joblib.load('saved_models/heart_disease_model_v1.joblib'); print('Model loaded successfully')"
